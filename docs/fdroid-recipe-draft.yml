# F-Droid build recipe: lives as metadata/io.github.comm0n_s3nse.jargon.yml in
# gitlab.com/fdroid/fdroiddata, submitted as a merge request. Checked with `fdroid lint` only
# (see docs/RELEASING.md); it has not been built on F-Droid's build server.
Categories:
  - Keyboard & IME
  - Speech Recognizer
License: BSD-3-Clause
AntiFeatures:
  NonFreeNet:
    en-US: Downloads the speech model the user chooses from Hugging Face; nothing else uses the network.
AuthorName: comm0n-s3nse
SourceCode: https://github.com/comm0n-s3nse/jargon
IssueTracker: https://github.com/comm0n-s3nse/jargon/issues
Changelog: https://github.com/comm0n-s3nse/jargon/blob/HEAD/FORK.md

AutoName: Jargon

RepoType: git
Repo: https://github.com/comm0n-s3nse/jargon.git

Builds:
  - versionName: '1.0'
    versionCode: 1
    commit: v1.0
    subdir: app
    submodules: true
    sudo:
      - apt-get update
      - apt-get install -y cmake
    gradle:
      - yes
    # whisper.cpp ships test models, example and binding sources the app never builds; the
    # scanner flags them (binary .bin files, package.json, a Gradle file), so they go before the build
    scandelete:
      - whisper.cpp/models
      - whisper.cpp/examples
      - whisper.cpp/bindings
    ndk: r25c
  - versionName: '1.1'
    versionCode: 2
    commit: v1.1
    subdir: app
    submodules: true
    sudo:
      - apt-get update
      - apt-get install -y cmake
    gradle:
      - yes
    # no prebuild: this build ships without a speech model, as the other Whisper keyboards on
    # F-Droid do. The app offers the model list on first open and downloads with a pinned SHA-256.
    # (scripts/fetch-model.sh bundles it for the GitHub and Play builds.)
    # whisper.cpp ships test models, example and binding sources the app never builds; the
    # scanner flags them (binary .bin files, package.json, a Gradle file), so they go before the build
    scandelete:
      - whisper.cpp/models
      - whisper.cpp/examples
      - whisper.cpp/bindings
    ndk: r25c

  - versionName: 1.1.1
    versionCode: 3
    commit: v1.1.1
    subdir: app
    submodules: true
    sudo:
      - apt-get update
      - apt-get install -y cmake
    gradle:
      - yes
    scandelete:
      - whisper.cpp/models
      - whisper.cpp/examples
      - whisper.cpp/bindings
    ndk: r25c

  - versionName: '1.2'
    versionCode: 4
    commit: v1.2
    subdir: app
    submodules: true
    sudo:
      - apt-get update
      - apt-get install -y cmake
    gradle:
      - yes
    scandelete:
      - whisper.cpp/models
      - whisper.cpp/examples
      - whisper.cpp/bindings
    ndk: r25c

AutoUpdateMode: Version
UpdateCheckMode: Tags
CurrentVersion: '1.2'
CurrentVersionCode: 4
