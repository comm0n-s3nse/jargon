# DRAFT of the F-Droid build recipe: it would live as metadata/<applicationId>.yml in
# gitlab.com/fdroid/fdroiddata, submitted as a merge request. Provisional until the app has its
# real name, applicationId, repository URL and a tagged release. Checked with `fdroid lint` only
# (see docs/RELEASING.md); it has not been built on F-Droid's build server.
Categories:
  - Keyboard & IME
  - Speech Recognizer
License: BSD-3-Clause
AuthorName: comm0n-s3nse
SourceCode: https://github.com/comm0n-s3nse/falaboard
IssueTracker: https://github.com/comm0n-s3nse/falaboard/issues
Changelog: https://github.com/comm0n-s3nse/falaboard/blob/HEAD/FORK.md

AutoName: Falaboard

RepoType: git
Repo: https://github.com/comm0n-s3nse/falaboard.git

Builds:
  - versionName: 1.1.0
    versionCode: 5
    commit: v1.1.0
    subdir: app
    submodules: true
    sudo:
      - apt-get update
      - apt-get install -y cmake
    gradle:
      - yes
    # no prebuild: this build ships without a speech model, as the other Whisper keyboards on
    # F-Droid do. The app offers the model list on first open and downloads with a pinned SHA-256.
    # (scripts/fetch-model.sh bundles it for the GitHub and Play builds.)
    ndk: r25c

AutoUpdateMode: Version
UpdateCheckMode: Tags
CurrentVersion: 1.1.0
CurrentVersionCode: 5
