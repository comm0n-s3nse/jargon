# DRAFT of the F-Droid build recipe: it would live as metadata/<applicationId>.yml in
# gitlab.com/fdroid/fdroiddata, submitted as a merge request. Provisional until the app has its
# real name, applicationId, repository URL and a tagged release. Checked with `fdroid lint` only
# (see docs/RELEASING.md); it has not been built on F-Droid's build server.
Categories:
  - Keyboard & IME
  - Speech Recognizer
License: BSD-3-Clause
AuthorName: pswel1
SourceCode: https://github.com/pswel1/falaboard
IssueTracker: https://github.com/pswel1/falaboard/issues
Changelog: https://github.com/pswel1/falaboard/blob/HEAD/FORK.md

AutoName: Falaboard

RepoType: git
Repo: https://github.com/pswel1/falaboard.git

Builds:
  - versionName: 1.1.0
    versionCode: 5
    commit: v1.1.0
    subdir: app
    submodules: true
    sudo:
      - apt-get update
      - apt-get install -y cmake
    gradle:
      - yes
    # the built-in model is not in git; download it and check its SHA-256
    prebuild: ../scripts/fetch-model.sh
    ndk: r25c

AutoUpdateMode: Version
UpdateCheckMode: Tags
CurrentVersion: 1.1.0
CurrentVersionCode: 5
